name: Feature request
description: 为 DangoMusic GTNH Edition 提出功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue，避免重复。功能建议需考虑 GTNH 1.7.10 / Forge 10.13.4.1614 的运行环境。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前的使用场景和痛点，而不是直接指定实现方式
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你希望模组如何表现？涉及 UI、HUD、歌词、音源或配置时请说明
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法，或现有的临时解决办法
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考实现、上游 DangoMusic 的行为等
    validations:
      required: false
