name: Build

on:
  push:
    branches:
      - port/gtnh-1.7.10
  pull_request:
    branches:
      - port/gtnh-1.7.10

permissions:
  contents: read

jobs:
  prepare-development-build:
    if: github.event_name == 'push' && !github.event.deleted && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: development-version-port-gtnh-1.7.10
      queue: max
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare development version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/development_version.py

  build:
    needs: prepare-development-build
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
          needs.prepare-development-build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-development-build.outputs.revision }}
          persist-credentials: false

      - name: Set up JDK 8 (compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 25 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace \
            -Porg.gradle.java.installations.paths="$JAVA_HOME_8_X64"

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dangomusicgtnh-jars
          path: build/libs/*.jar
          if-no-files-found: error
