name: Build

on:
  push:
    branches:
      - port/gtnh-1.7.10
  pull_request:
    branches:
      - port/gtnh-1.7.10

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8 (compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 25 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace \
            -Porg.gradle.java.installations.paths="$JAVA_HOME_8_X64"

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dangomusicgtnh-jars
          path: build/libs/*.jar
          if-no-files-found: warn
